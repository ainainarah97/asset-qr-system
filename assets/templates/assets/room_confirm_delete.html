{% extends "assets/base.html" %}

{% block title %}
Delete Room | Asset QR System
{% endblock %}

{% block content %}
    <h2>Delete Room / Open Area</h2>

    <form method="post">
        {% csrf_token %}

        <p>
            Are you sure you want to delete
            <strong>{{ room }}</strong>?
        </p>

        <p>
            Deleting this room may also delete its related components.
        </p>

        <button type="submit">
            Confirm Delete
        </button>

        <a
            href="{% url 'assets:room_list' %}"
            class="button"
        >
            Cancel
        </a>
    </form>
{% endblock %}
