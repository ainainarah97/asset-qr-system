<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
Login | Asset QR System
</title>


<style>

:root {

    --primary: #0F8F87;
    --primary-dark: #0B716B;
    --primary-soft: #D9F2EF;

    --surface: #ffffff;
    --background: #f8fafc;

    --border: #e2e8f0;

    --text-primary: #0f172a;
    --text-secondary: #64748b;

    --shadow:
        0 10px 25px rgba(15,23,42,0.08);

    --radius: 18px;

}


* {
    box-sizing: border-box;
}


body {

    margin:0;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    background:var(--background);

    font-family:Arial,sans-serif;

    color:var(--text-primary);

}



.login-container {

    width:100%;

    max-width:460px;

    padding:20px;

}



.system-brand {

    text-align:center;

    margin-bottom:35px;

}



.system-brand h1 {

    margin:0;

    font-size:34px;

    line-height:1.25;

    font-weight:800;

    color:var(--primary);

}



.system-brand p {

    margin-top:10px;

    color:var(--text-secondary);

    font-size:15px;

}



.login-card {

    background:var(--surface);

    border:1px solid var(--border);

    border-radius:var(--radius);

    padding:38px;

    box-shadow:var(--shadow);

}



.login-card h2 {

    text-align:center;

    margin:0 0 10px;

    font-size:26px;

}



.login-description {

    text-align:center;

    color:var(--text-secondary);

    font-size:15px;

    margin-bottom:30px;

}



.form-group {

    margin-bottom:20px;

}



label {

    display:block;

    margin-bottom:8px;

    font-weight:700;

    font-size:15px;

}



input {

    width:100%;

    padding:15px 18px;

    border-radius:30px;

    border:1px solid var(--border);

    background:#eef7f6;

    font-size:15px;

}



input:focus {

    outline:none;

    border-color:var(--primary);

    box-shadow:
        0 0 0 3px var(--primary-soft);

}



/* PASSWORD EYE */

.password-wrapper {

    position:relative;

}



.password-wrapper input {

    padding-right:55px;

}



.toggle-password {

    position:absolute;

    right:18px;

    top:50%;

    transform:translateY(-50%);

    color:#94a3b8;

    cursor:pointer;

    font-size:18px;

    user-select:none;

}



/* LOGIN BUTTON */

button {

    width:220px;

    display:block;

    margin:30px auto 0;

    padding:14px;

    border:none;

    border-radius:30px;

    background:var(--primary);

    color:white;

    font-size:16px;

    font-weight:700;

    cursor:pointer;

}



button:hover {

    background:var(--primary-dark);

}



.login-error {

    padding:12px;

    margin-bottom:20px;

    border-radius:10px;

    background:#fee2e2;

    color:#b91c1c;

    text-align:center;

    font-size:14px;

}



.login-footer {

    margin-top:25px;

    text-align:center;

    color:var(--text-secondary);

    font-size:13px;

}



@media(max-width:500px){

    .system-brand h1{

        font-size:26px;

    }


    .login-card{

        padding:28px;

    }

}


</style>

</head>



<body>


<div class="login-container">


    <div class="system-brand">

        <h1>
            Government Asset<br>
            Information System
        </h1>


        <p>
            Asset QR Management Portal
        </p>

    </div>



    <div class="login-card">


        <h2>
            Authorised Login
        </h2>


        <div class="login-description">

            Sign in to access restricted
            asset management functions.

        </div>



        <form method="post">

            {% csrf_token %}



            {% if form.errors %}

            <div class="login-error">

                Invalid username or password.
                Please try again.

            </div>

            {% endif %}




            <div class="form-group">


                <label for="id_username">

                    Username

                </label>


                <input

                    type="text"

                    name="username"

                    id="id_username"

                    placeholder="Enter your username"

                    autocomplete="username"

                    required

                >


            </div>





            <div class="form-group">


                <label for="id_password">

                    Password

                </label>



                <div class="password-wrapper">


                    <input

                        type="password"

                        name="password"

                        id="id_password"

                        placeholder="Enter your password"

                        autocomplete="current-password"

                        required

                    >



                    <span

                        class="toggle-password"

                        onclick="togglePassword()"

                    >

                        👁

                    </span>



                </div>


            </div>




            {% if next %}

            <input

                type="hidden"

                name="next"

                value="{{ next }}"

            >

            {% endif %}





            <button type="submit">

                Sign In

            </button>



        </form>


    </div>




    <div class="login-footer">

        Authorised personnel only

    </div>



</div>




<script>


function togglePassword(){


    const password =
        document.getElementById(
            "id_password"
        );


    if(password.type === "password"){

        password.type = "text";

    }

    else {

        password.type = "password";

    }


}


</script>



</body>


</html>
